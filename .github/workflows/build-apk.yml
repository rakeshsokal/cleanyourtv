# Builds CleanYourTV's launcher and publishes it as a GitHub release asset,
# so the TV's Downloader app can fetch it from a plain public URL.
# Put this file at .github/workflows/build-apk.yml in your fork. It runs when
# pushed, or from the Actions tab ("Build launcher APK" -> "Run workflow").
name: Build launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same SDK packages the upstream CI uses; the runner image ships the SDK itself.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build release APK
        working-directory: launcher
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk tvhome.apk
          gh release create "apk-${{ github.run_number }}" tvhome.apk \
            --title "Launcher APK ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
